<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geometry Mid-Year Practice</title><style>
body{font-family:system-ui;background:#f2f6fb;color:#21364b;margin:0}main{max-width:780px;margin:30px auto;padding:15px}
header{background:#174a7a;color:white;padding:24px;border-radius:15px}h1{margin:0 0 8px}header p{margin:0}
section{background:white;border-radius:15px;margin-top:16px;padding:22px;box-shadow:0 3px 15px #1232}
select,button{font:inherit;border:1px solid #b7cadb;border-radius:9px;padding:12px;background:white;cursor:pointer}
button:hover{background:#eaf3fd}button:focus-visible{outline:3px solid orange}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px} .options button{text-align:left;min-height:55px}
svg{display:block;width:100%;max-width:360px;margin:auto;background:#f7fbff;border-radius:10px}
.good{background:#dcf7e5!important;border-color:#18844b!important}.bad{background:#ffe2e2!important;border-color:#c44!important}
#next{background:#175c99;color:white;display:none}#feedback{min-height:38px;font-weight:bold}#bar{height:9px;background:#dce8f3;border-radius:9px;margin:15px 0}#fill{height:100%;background:#2980bf;width:0;border-radius:9px}
@media(max-width:500px){.options{grid-template-columns:1fr}}
</style></head><body><main><header><h1>Geometry Mid-Year Study</h1><p>New questions • Diagrams • Instant feedback • Self-paced</p></header>
<section><label for="topic">Topic: </label><select id="topic"><option>All</option></select> <button id="restart">Shuffle / Restart</button></section>
<section><div id="progress"></div><div id="bar"><div id="fill"></div></div><p id="category"></p><h2 id="question"></h2><div id="diagram"></div><div class="options" id="options"></div><p id="feedback" aria-live="polite"></p><button id="next">Next question →</button></section>
</main><script>const data=[{"topic": "Angles", "q": "A linear pair contains an angle of 124°. Find the other angle.", "options": [64, 50, 56, 44], "answer": 2, "diagram": "linear"}, {"topic": "Angles", "q": "Complementary angles measure 37° and x°. Find x.", "options": [41, 53, 47, 61], "answer": 1, "diagram": "none"}, {"topic": "Angles", "q": "An angle of 146° is bisected. Find each smaller angle.", "options": [61, 67, 81, 73], "answer": 3, "diagram": "none"}, {"topic": "Angles", "q": "Vertical angles measure (5x+8)° and (7x−14)°. Find x.", "options": [19, -1, 11, 5], "answer": 2, "diagram": "linear"}, {"topic": "Parallel Lines", "q": "Corresponding angles measure (8x+6)° and (10x−18)°. Find x.", "options": [0, 20, 6, 12], "answer": 3, "diagram": "parallel"}, {"topic": "Parallel Lines", "q": "Alternate interior angles measure (4x+17)° and (7x−16)°. Find x.", "options": [19, 11, -1, 5], "answer": 1, "diagram": "parallel"}, {"topic": "Parallel Lines", "q": "Consecutive interior angles measure 116° and x°. Find x.", "options": [58, 52, 64, 72], "answer": 2, "diagram": "none"}, {"topic": "Parallel Lines", "q": "Alternate exterior angles measure (6x+5)° and (9x−28)°. Find x.", "options": [11, 19, -1, 5], "answer": 0, "diagram": "parallel"}, {"topic": "Slope", "q": "Find the slope through (−2, 1) and (4, 13).", "options": [2, -10, 10, -4], "answer": 0, "diagram": "graph"}, {"topic": "Slope", "q": "Find the slope through (−3, 7) and (5, 3).", "options": [-12.5, 7.5, -6.5, -0.5], "answer": 3, "diagram": "none"}, {"topic": "Slope", "q": "Find the slope of a line perpendicular to a line with slope 2.", "options": [-6.5, -0.5, 7.5, -12.5], "answer": 1, "diagram": "none"}, {"topic": "Slope", "q": "Find the slope of a line parallel to y = −3x + 8.", "options": [-15, -9, -3, 5], "answer": 2, "diagram": "graph"}, {"topic": "Slope", "q": "Find the slope of a horizontal line.", "options": [8, 0, -6, -12], "answer": 1, "diagram": "graph"}, {"topic": "Triangle Angles", "q": "A triangle has angles of 42° and 68°. Find the third angle.", "options": [64, 78, 70, 58], "answer": 2, "diagram": "triangle"}, {"topic": "Triangle Angles", "q": "The remote interior angles are 51° and 76°. Find the exterior angle.", "options": [127, 121, 135, 115], "answer": 0, "diagram": "exterior"}, {"topic": "Triangle Angles", "q": "An isosceles triangle has vertex angle 50°. Find each base angle.", "options": [59, 73, 65, 53], "answer": 2, "diagram": "triangle"}, {"topic": "Triangle Angles", "q": "Triangle angles measure (3x+8)°, (4x+10)°, and (2x+9)°. Find x.", "options": [5, 25, 11, 17], "answer": 3, "diagram": "none"}, {"topic": "Triangle Angles", "q": "An exterior angle measures 135°. One remote interior angle is 62°. Find the other.", "options": [81, 61, 67, 73], "answer": 3, "diagram": "exterior"}, {"topic": "Congruence", "q": "Which criterion proves congruence from three pairs of sides?", "options": ["Corresponding angles theorem", "SSS", "AAS", "Symmetric"], "answer": 1, "diagram": "none"}, {"topic": "Congruence", "q": "Which criterion uses two sides and the included angle?", "options": ["Reflexive", "SSS", "SAS", "Transitive"], "answer": 2, "diagram": "twotri"}, {"topic": "Congruence", "q": "Which criterion uses two angles and their included side?", "options": ["Symmetric", "Reflexive", "SAS", "ASA"], "answer": 3, "diagram": "twotri"}, {"topic": "Congruence", "q": "Which criterion uses two angles and a nonincluded side?", "options": ["HL", "Symmetric", "AAA", "AAS"], "answer": 3, "diagram": "none"}, {"topic": "Congruence", "q": "Which criterion proves right triangles congruent using hypotenuse and leg?", "options": ["SAS", "SSS", "HL", "Reflexive"], "answer": 2, "diagram": "righttri"}, {"topic": "Congruence", "q": "Which criterion does NOT guarantee triangle congruence?", "options": ["Alternate interior angles theorem", "Symmetric", "HL", "AAA"], "answer": 3, "diagram": "twotri"}, {"topic": "Proofs", "q": "What property shows a segment is congruent to itself?", "options": ["Reflexive", "AAA", "SSS", "Symmetric"], "answer": 0, "diagram": "twotri"}, {"topic": "Proofs", "q": "What theorem says vertical angles are congruent?", "options": ["ASA", "Alternate interior angles theorem", "Vertical angles theorem", "AAS"], "answer": 2, "diagram": "none"}];function diagram(t){
if(t==='none')return '';
let a='',line=(x,y,u,v)=>`<line x1="${x}" y1="${y}" x2="${u}" y2="${v}" stroke="#2364a0" stroke-width="3"/>`;
if(t==='linear')a=line(30,140,300,140)+line(165,140,215,30);
if(t==='parallel')a=line(30,55,300,55)+line(30,155,300,155)+line(100,190,225,15);
if(t==='graph')a=line(30,155,300,155)+line(165,15,165,205)+line(50,180,280,55);
if(t==='triangle'||t==='exterior')a=line(40,170,270,170)+line(40,170,155,25)+line(155,25,270,170)+(t==='exterior'?line(270,170,325,170):'');
if(t==='twotri'||t==='righttri')a=line(25,175,125,25)+line(125,25,155,175)+line(155,175,25,175)+line(190,175,245,25)+line(245,25,320,175)+line(320,175,190,175);
return `<svg viewBox="0 0 340 215" aria-label="Geometry reference diagram" role="img">${a}</svg>`;
}
const el=x=>document.getElementById(x);let deck=[],i=0,score=0,locked=false;
[...new Set(data.map(x=>x.topic))].forEach(x=>{let o=document.createElement('option');o.textContent=x;el('topic').append(o)});
function start(){deck=data.filter(x=>el('topic').value==='All'||x.topic===el('topic').value).sort(()=>Math.random()-.5);i=0;score=0;show()}
function show(){locked=false;el('feedback').textContent='';el('next').style.display='none';el('progress').textContent=`Question ${Math.min(i+1,deck.length)} of ${deck.length} • Correct: ${score}`;el('fill').style.width=(i/deck.length*100)+'%';
if(i===deck.length){el('category').textContent='Completed';el('question').textContent=`Your score: ${score} / ${deck.length}`;el('diagram').innerHTML='';el('options').innerHTML='';el('fill').style.width='100%';return}
let q=deck[i];el('category').textContent=q.topic;el('question').textContent=q.q;el('diagram').innerHTML=([1,2].includes(data.indexOf(q)) ? '' : diagram(q.diagram));el('options').innerHTML='';
q.options.forEach((a,j)=>{let b=document.createElement('button');b.textContent=String.fromCharCode(65+j)+'. '+a;b.onclick=()=>answer(j);el('options').append(b)})}
function answer(j){if(locked)return;locked=true;let q=deck[i];if(j===q.answer)score++;[...el('options').children].forEach((b,k)=>{b.disabled=true;if(k===q.answer)b.classList.add('good');else if(k===j)b.classList.add('bad')});
el('feedback').textContent=j===q.answer?'Correct!':`Correct answer: ${q.options[q.answer]}`;el('progress').textContent=`Question ${i+1} of ${deck.length} • Correct: ${score}`;el('next').style.display='inline-block'}
el('next').onclick=()=>{i++;show()};el('restart').onclick=start;el('topic').onchange=start;start();</script></body></html>
